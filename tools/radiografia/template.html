<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radiografía CHASEP · Histórico y equipos</title>
<style>
:root{--navy:#0A2A5E;--blue:#1D5FD0;--blue2:#5B95F2;--silver:#B4BAD2;--silver2:#EEF0F8;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--good:#0E8A4F;--bad:#C53030;--grid:#e9edf5;--hl:#eaf1ff}
@media (prefers-color-scheme:dark){:root{--ink:#f1f5f9;--ink2:#cbd5e1;--ink3:#7c8aa5;--bg:#0b1220;--card:#121b2e;--line:#22304a;--silver2:#1a2540;--blue:#5B95F2;--blue2:#8DB6F7;--grid:#1f2a40;--good:#3ccf8e;--bad:#F37B7B;--hl:#16264a}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit}
header{background:linear-gradient(135deg,var(--navy),#123f8a);color:#fff;padding:16px 0 12px;padding-top:max(16px,env(safe-area-inset-top))}
header h1{margin:0;font-size:1.2rem}header p{margin:4px 0 0;color:#c9d3ea;font-size:.78rem}
.wrap{max-width:1150px;margin:0 auto;padding:0 12px}
main.wrap{padding-bottom:70px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}.hs::-webkit-scrollbar{display:none}
.chip,.tab,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 12px;font-size:.8rem;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab{border-radius:8px}.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border-radius:8px;display:inline-flex;gap:6px;align-items:center}.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.seg button{border:0;background:transparent;padding:7px 10px;font-size:.78rem;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}.seg button.on{background:var(--blue);color:#fff}
select.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:.8rem;font-weight:600}
.af{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.af span{background:var(--hl);color:var(--blue);border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:600;cursor:pointer}
section{display:none;padding-top:12px}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .l{font-size:.7rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}.tile .v{font-size:1.4rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.tile .s{font-size:.76rem;color:var(--ink2);margin-top:2px;line-height:1.35}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--blue)}
.up{color:var(--good)}.dn{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.card h3{margin:0 0 6px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:.78rem;line-height:1.4}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--ink2);margin:4px 0}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.74rem;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;color:var(--ink);z-index:2}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;position:relative}.team:hover{border-color:var(--blue)}
.team .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.team .nm{font-weight:700}.tag{font-size:.66rem;padding:2px 7px;border-radius:999px;background:var(--silver2);color:var(--ink2);font-weight:600;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.8rem;margin-top:8px}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.abtn{border:0;background:#fde8e8;color:#9b1c1c;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){.abtn{background:#3b1717;color:#F8A5A5}}
.go{font-size:.74rem;color:var(--blue);font-weight:600;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.78rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--ink2);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--card);z-index:1}
td.t,th.t{text-align:left}td.t{max-width:240px;overflow:hidden;text-overflow:ellipsis}tr>:first-child{position:sticky;left:0;background:var(--card);z-index:1}th:first-child{z-index:2}tr.tot>:first-child{background:var(--silver2)}td .sm{display:block;font-size:.68rem;color:var(--ink2);font-weight:400}@media(max-width:600px){td.t{max-width:150px}}tr.click{cursor:pointer}tr.click:hover td{background:var(--hl)}tr.tot td{font-weight:700;background:var(--silver2)}
.scroll{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.lvl{display:inline-block;min-width:32px;text-align:center;font-size:.64rem;font-weight:700;border-radius:5px;padding:1px 4px;margin-right:6px;background:var(--silver2);color:var(--navy)}
@media (prefers-color-scheme:dark){.lvl{color:var(--blue2)}}
.lvl.dj{background:transparent;border:1px solid var(--silver);color:var(--ink2)}
.sev{flex:none;font-size:.66rem;font-weight:700;border-radius:6px;padding:2px 6px;height:fit-content;white-space:nowrap}.s3{background:#fde8e8;color:#9b1c1c}.s2{background:#fdf3dc;color:#8a5a0a}.s1{background:var(--silver2);color:var(--ink2)}
@media (prefers-color-scheme:dark){.s3{background:#3b1717;color:#F8A5A5}.s2{background:#3a2c10;color:#F5CD7A}}
.al{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:.82rem;cursor:pointer}.al:first-child{border-top:0}
input[type=search],.fsel{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid label{font-size:.72rem;color:var(--ink2);font-weight:600;display:block}.fgrid label .fsel{margin-top:4px}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:980px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 12px 34px}
.panel .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 8px;z-index:3}
.panel h2{margin:0;font-size:1.08rem}.x{border:0;background:var(--silver2);color:var(--ink);border-radius:999px;width:32px;height:32px;font-size:1rem;cursor:pointer;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:.74rem;color:var(--ink2);margin-top:10px;line-height:1.45}
.warn{background:#fff7e6;border:1px solid #f5d38a;color:#7a4e00;border-radius:10px;padding:8px 10px;font-size:.78rem;margin-top:10px}
@media (prefers-color-scheme:dark){.warn{background:#2c220d;border-color:#6b5320;color:#f5cd7a}}
.guide h4{margin:14px 0 4px;font-size:.88rem}.guide p,.guide li{font-size:.8rem;color:var(--ink2);line-height:1.5}
@media print{.bar,.acts,.x,#fbtn{display:none!important}body.sheeton main,body.sheeton header{display:none}.sheet.on{position:static;background:none;display:block}.panel{max-height:none;overflow:visible;border-radius:0}.scroll{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Radiografía · CHASEP Global</h1><p id="sub"></p></div></header>
<main class="wrap">
 <div class="bar">
  <div class="hs" id="reds"></div>
  <div class="hs" style="margin-top:6px">
   <select class="mini" id="mes" aria-label="Mes"></select>
   <div class="seg" id="cmp"><button data-c="mom">vs mes ant.</button><button data-c="yoy">vs mismo mes año ant.</button><button data-c="ytd">Acumulado (YTD)</button></div>
  </div>
  <div class="hs" style="margin-top:6px">
   <select class="mini" id="met" aria-label="Métrica"><option value="cc">Compras compañía (USD)</option><option value="ord">Órdenes</option><option value="rec">Reclutamiento</option><option value="tk">Ticket promedio (MXN)</option></select>
   <button class="btn" id="fbtn">⚙︎ Filtros <span id="fn"></span></button>
  </div>
  <div class="af" id="af"></div>
  <div class="hs" id="tabs" style="margin-top:8px"></div>
 </div>
 <section id="s-res"></section>
 <section id="s-eq"></section>
 <section id="s-co"></section>
 <section id="s-di"></section>
 <section id="s-me"></section>
 <section id="s-al"></section>
 <section id="s-hi"></section>
 <section id="s-gu"></section>
</main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ml=m=>MES[+m.slice(5)-1]+' '+m.slice(2,4);
const cTxt=c=>c?ml(c.slice(0,4)+'-'+c.slice(4)):'';
const fm={usd:v=>v==null?'–':'$'+Math.round(v).toLocaleString('es-MX'),k:v=>v==null?'–':(Math.abs(v)>=1e6?'$'+(v/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?'$'+(v/1e3).toFixed(1)+'k':'$'+Math.round(v)),n:v=>v==null?'–':Math.round(v).toLocaleString('es-MX'),p:(v,d=1)=>v==null?'–':(v*100).toFixed(d)+'%'};
const vr=(a,b)=>(a==null||b==null||!a)?null:(b-a)/Math.abs(a);
const sg=v=>v==null?'<span class="muted">–</span>':`<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v*100).toFixed(1)}%</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MET={cc:{n:'Compras compañía',u:'USD',k:'compras_compania',f:fm.k,ff:fm.usd},ord:{n:'Órdenes',u:'',k:'ordenes',f:fm.n,ff:fm.n},rec:{n:'Reclutamiento',u:'',k:'reclutamiento',f:fm.n,ff:fm.n},tk:{n:'Ticket promedio',u:'MXN',k:'ticket_mxn',f:fm.k,ff:fm.usd}};
const CMP={mom:'vs mes anterior',yoy:'vs mismo mes del año anterior',ytd:'acumulado del año vs mismo periodo del año anterior'};
const lastIdx=D.meses.length-1;
const ALx={};D.alertas.forEach(a=>(ALx[a.id]=ALx[a.id]||[]).push(a));
D.dists.forEach(d=>{d.al=ALx[d.id]||[];d.grp=(d.id=='13588'||d.id=='29365')?'PNL':(['ROYAL','BLUE','DJ','PNL'].includes(d.nivel)||/^N\d/.test(d.nivel||''))?d.nivel:d.es_dj?'DJ':((d.fcr||'').trim()||'Sin nivel');
 const fd=d.fecha_dist?new Date(d.fecha_dist):null;d.anios=fd?(Date.now()-fd)/31557600000:null;d.comp=d.comp||'(sin compañía)';d.suc=d.suc||'(sin sucursal)';
 d.lastData=(()=>{const s=d.m.compras_compania;for(let i=s.length-1;i>=0;i--)if(s[i]!=null)return i;return -1})()});
let S={red:'Todas',mes:lastIdx,cmp:'mom',met:'cc',sub:'',comp:'',suc:'',grp:'',tipo:'',est:'act',alerta:'',act:'',ant:'',tab:'res'};
// ---------- agregación ----------
function agg(L,met,i){if(i<0||i>lastIdx)return null;if(met=='tk'){let s=0,o=0;L.forEach(d=>{const t=d.m.ticket_mxn[i],n=d.m.ordenes[i];if(t!=null&&n){s+=t*n;o+=n}});return o?s/o:null}
 let s=0,h=false;L.forEach(d=>{const v=d.m[MET[met].k][i];if(v!=null){s+=v;h=true}});return h?s:null}
function ytdIdx(i){const y=D.meses[i].slice(0,4);const r=[];for(let j=0;j<=i;j++)if(D.meses[j].startsWith(y))r.push(j);return r}
function aggR(L,met,ids){if(met=='tk'){let s=0,o=0;ids.forEach(i=>L.forEach(d=>{const t=d.m.ticket_mxn[i],n=d.m.ordenes[i];if(t!=null&&n){s+=t*n;o+=n}}));return o?s/o:null}
 let s=0,h=false;ids.forEach(i=>{const v=agg(L,met,i);if(v!=null){s+=v;h=true}});return h?s:null}
const has=(d,i)=>i>=0&&d.m.compras_compania[i]!=null;
function lk(L,i){const X=L.filter(d=>has(d,i));return X.length?X:L}
function period(L,met,i=S.mes,cmp=S.cmp){
 if(cmp=='ytd'){const a=ytdIdx(i),b=a.map(j=>j-12).filter(j=>j>=0);const X=L.filter(d=>a.some(j=>has(d,j)));const Y=X.length?X:L;return{cur:aggR(Y,met,a),base:b.length==a.length?aggR(Y,met,b):null}}
 const Y=lk(L,i);return{cur:agg(Y,met,i),base:agg(Y,met,cmp=='mom'?i-1:i-12)}}
const perLbl=(i=S.mes)=>S.cmp=='ytd'?`ene–${MES[+D.meses[i].slice(5)-1]} ${D.meses[i].slice(0,4)}`:ml(D.meses[i]);
const baseLbl=(i=S.mes)=>S.cmp=='mom'?(i>0?ml(D.meses[i-1]):'–'):S.cmp=='yoy'?(i>=12?ml(D.meses[i-12]):'–'):`ene–${MES[+D.meses[i].slice(5)-1]} ${+D.meses[i].slice(0,4)-1}`;
// ---------- filtros ----------
function pass(d,ign=''){
 if(S.red!='Todas'&&d.red!=S.red)return false;
 if(S.est=='act'&&d.baja)return false;if(S.est=='baja'&&!d.baja)return false;
 if(ign!='sub'&&S.sub&&d.sub!=S.sub)return false;if(ign!='comp'&&S.comp&&d.comp!=S.comp)return false;
 if(ign!='suc'&&S.suc&&d.suc!=S.suc)return false;if(S.grp&&d.grp!=S.grp)return false;
 if(S.tipo=='dist'&&d.es_dj)return false;if(S.tipo=='dj'&&!d.es_dj)return false;
 if(S.alerta=='con'&&!d.al.length)return false;if(S.alerta=='sin'&&d.al.length)return false;if(S.alerta&&!['con','sin'].includes(S.alerta)&&!d.al.some(a=>a.tipo==S.alerta))return false;
 if(S.act){const v=d.m.compras_compania[S.mes],p=d.m.compras_compania[S.mes-1];if(S.act=='con'&&!(v>0))return false;if(S.act=='sin'&&(v==null||v>0))return false;if(S.act=='sin2'&&(v==null||p==null||v>0||p>0))return false}
 if(S.ant){const a=d.anios;if(a==null)return false;if(S.ant=='1'&&!(a<1))return false;if(S.ant=='3'&&!(a>=1&&a<3))return false;if(S.ant=='3+'&&!(a>=3))return false}
 return true}
const DS=(ign)=>D.dists.filter(d=>pass(d,ign));
const uniq=(L,k)=>[...new Set(L.map(d=>d[k]))].sort((a,b)=>String(a).localeCompare(String(b)));
const FDEF=[['sub','Subterritorio'],['comp','Compañía'],['suc','Sucursal'],['grp','Nivel'],['tipo','Tipo'],['est','Estatus'],['alerta','Alertas'],['act','Actividad del mes'],['ant','Antigüedad']];
function fOpts(k){const base=D.dists.filter(d=>S.red=='Todas'||d.red==S.red);
 if(k=='sub')return [['','Todos'],...uniq(base,'sub').map(x=>[x,x])];
 if(k=='comp')return [['','Todas'],...uniq(base.filter(d=>!S.sub||d.sub==S.sub),'comp').map(x=>[x,x])];
 if(k=='suc')return [['','Todas'],...uniq(base,'suc').map(x=>[x,x])];
 if(k=='grp')return [['','Todos'],...['PNL','ROYAL','BLUE','N1','N2','N3','N4','DJ'].filter(g=>base.some(d=>d.grp==g)).map(x=>[x,x])];
 if(k=='tipo')return [['','Distribuidores y DJ'],['dist','Solo distribuidores'],['dj','Solo DJ']];
 if(k=='est')return [['act','Activos'],['baja','Solo bajas (hoja BAJAS)'],['todos','Todos']];
 if(k=='alerta')return [['','Todas'],['con','Con alguna alerta'],['sin','Sin alertas'],...[...new Set(D.alertas.map(a=>a.tipo))].map(t=>[t,'Alerta: '+t])];
 if(k=='act')return [['','Todos'],['con','Con compras en el mes'],['sin','Sin compras en el mes'],['sin2','Sin compras 2 meses seguidos']];
 if(k=='ant')return [['','Todas'],['1','Menos de 1 año como distribuidor'],['3','1 a 3 años'],['3+','Más de 3 años']]}
const fLabel=k=>{const o=fOpts(k).find(x=>x[0]==S[k]);return o?o[1]:S[k]};
function openFilters(){
 $('#panel').innerHTML=`<div class="top"><h2>Filtros</h2><button class="x" aria-label="Cerrar">✕</button></div>
 <p class="muted">Aplican a todas las pestañas, tablas y descargas.</p>
 <div class="fgrid">${FDEF.map(([k,l])=>`<label>${l}<select class="fsel" data-f="${k}">${fOpts(k).map(([v,t])=>`<option value="${esc(v)}"${S[k]==v?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`).join('')}</div>
 <div class="acts"><button class="btn" id="fclr">Limpiar filtros</button><button class="btn pri x" style="width:auto;padding:0 14px">Ver resultados (${DS().length})</button></div>`;
 openSheet();
 document.querySelectorAll('[data-f]').forEach(s=>s.onchange=()=>{S[s.dataset.f]=s.value;if(s.dataset.f=='sub')S.comp='';render();openFilters()});
 $('#fclr').onclick=()=>{FDEF.forEach(([k])=>S[k]=k=='est'?'act':'');render();openFilters()}}
// ---------- descargas ----------
function csv(name,head,rows){const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const tag=[S.red!='Todas'?S.red:'',S.sub,S.comp].filter(Boolean).join('_');
 const fn=`Radiografia_${name}${tag?'_'+tag:''}_${D.meses[S.mes]}`.replace(/[^\wÁÉÍÓÚÑáéíóúñ-]+/g,'-')+'.csv';
 const b=new Blob(['﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const r2=v=>v==null?'':Math.round(v*100)/100;const pc=v=>v==null?'':Math.round(v*1000)/10;
const DL={};let dlN=0;const dlBtn=(fn,t='Descargar CSV')=>{const id='dl'+(dlN++);DL[id]=fn;return `<button class="btn" data-dl="${id}">⬇︎ ${t}</button>`};
function distRows(L){return L.map(d=>{const c=period([d],'cc');return[d.id,d.nombre,d.red,d.sub,d.comp,d.grp,d.sponsor,d.suc,d.es_dj?'DJ':'Distribuidor',d.baja?'Baja':'Activo',r2(c.cur),r2(c.base),pc(vr(c.base,c.cur)),r2(period([d],'ord').cur),r2(period([d],'rec').cur),r2(period([d],'tk').cur),pc(d.reserva),pc(d.mor31),pc(d.mortot),pc(d.recompra),d.al.map(a=>a.tipo+': '+a.detalle).join(' | ')]})}
const distHead=()=>['ID','Nombre','Red','Subterritorio','Compañía','Nivel','Sponsor','Sucursal','Tipo','Estatus',`Compras compañía USD (${perLbl()})`,`Compras compañía USD (${baseLbl()})`,'Var %',`Órdenes (${perLbl()})`,`Reclutamiento (${perLbl()})`,`Ticket prom. MXN (${perLbl()})`,'Reserva %','Morosidad 31+ %','Morosidad total %','Recompra %','Alertas'];
function monthRows(L){const y=+D.meses[S.mes].slice(0,4);const rows=[];for(let k=0;k<12;k++){const i=D.meses.indexOf(y+'-'+String(k+1).padStart(2,'0'));const j=D.meses.indexOf((y-1)+'-'+String(k+1).padStart(2,'0'));
 const row=[MES[k]];const Y=i>=0?lk(L,i):L;['cc','ord','rec','tk'].forEach(m=>{const a=i>=0?agg(L,m,i):null,b=j>=0?agg(Y,m,j):null,p=i>0?agg(Y,m,i-1):null;row.push(r2(a),r2(b),pc(vr(b,a)),pc(vr(p,a)))});rows.push(row)}return rows}

function lineChart(el,labels,series,opt={}){
 const W=Math.max(300,Math.round(el.clientWidth||700)),H=opt.h||230,P={l:54,r:12,t:10,b:28};
 const all=series.flatMap(s=>s.v).filter(v=>v!=null);const max=(Math.max(0,...all)*1.08)||1;
 const x=i=>P.l+(labels.length<2?0:i*(W-P.l-P.r)/(labels.length-1)),y=v=>H-P.b-(v/max)*(H-P.t-P.b);
 let g='';if(opt.mark!=null&&opt.mark>=0)g+=`<rect x="${x(opt.mark)-6}" y="${P.t}" width="12" height="${H-P.t-P.b}" fill="var(--blue)" fill-opacity=".12" rx="4"/>`;
 for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P.l-6}" y="${yy+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${(opt.yfmt||fm.k)(v)}</text>`}
 const step=Math.ceil(labels.length/(W<500?6:12));labels.forEach((l,i)=>{if(i%step==0)g+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink3)">${l}</text>`});
 series.forEach(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v);pen=true});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s.v.forEach((v,i)=>{if(v!=null&&(i==s.v.length-1||s.v[i+1]==null))g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}" stroke="var(--card)" stroke-width="2"/>`})});
 g+=`<line class="xh" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink3)" stroke-dasharray="3 3" style="display:none"/><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/>`;
 el.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label||''}">${g}</svg><div class="tip"></div></div>`;
 const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
 const move=ev=>{const r=svg.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,sx=px*W/r.width;let i=Math.round((sx-P.l)/((W-P.l-P.r)/(labels.length-1||1)));i=Math.max(0,Math.min(labels.length-1,i));
  xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';
  tip.innerHTML=`<b>${opt.tipLabel?opt.tipLabel(i):labels[i]}</b>`+series.map(s=>`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:5px"></i>${s.n}: <b>${(opt.fmt||fm.usd)(s.v[i])}</b></div>`).join('');
  tip.style.display='block';const tx=x(i)*r.width/W;tip.style.left=Math.min(r.width-tip.offsetWidth,Math.max(0,tx-tip.offsetWidth/2))+'px';tip.style.top='0px'};
 svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('mouseleave',()=>{tip.style.display='none';xh.style.display='none'})}
function spark(v,c='var(--blue)'){const W=110,H=28,vs=v.filter(x=>x!=null);if(vs.length<2)return'';const mx=Math.max(...vs,1);let d='',pen=false;v.forEach((a,i)=>{if(a==null){pen=false;return}d+=(pen?'L':'M')+(i*W/(v.length-1)).toFixed(1)+','+(H-2-(a/mx)*(H-4)).toFixed(1);pen=true});return`<svg viewBox="0 0 ${W} ${H}" width="110" height="28" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`}

 if(S.tab=='al'){const ids=new Set(L.map(d=>d.id));const A=D.alertas.filter(a=>ids.has(a.id));const tipos=[...new Set(A.map(a=>a.tipo))];

let SORT={k:'cur',d:-1};
function tabla(){const q=($('#q').value||'').toUpperCase();const m=S.met,F=MET[m].ff;
 let L=DS().filter(d=>!q||d.nombre.toUpperCase().includes(q)||d.id.includes(q));
 const P=new Map(L.map(d=>[d.id,period([d],m)]));
 const get={nom:d=>d.nombre,sub:d=>d.sub,comp:d=>d.comp,grp:d=>d.grp,suc:d=>d.suc,cur:d=>P.get(d.id).cur??-1e12,base:d=>P.get(d.id).base??-1e12,var:d=>vr(P.get(d.id).base,P.get(d.id).cur)??-1e9,mor:d=>d.mortot??-1,res:d=>d.reserva??-1,al:d=>d.al.length};
 L.sort((a,b)=>{const x=get[SORT.k](a),y=get[SORT.k](b);return (x>y?1:x<y?-1:0)*SORT.d});
 const h=(k,t,c='')=>`<th class="${c}" data-s="${k}">${t}${SORT.k==k?(SORT.d>0?' ↑':' ↓'):''}</th>`;
 $('#dinote').innerHTML=noData(L);
 $('#didl').innerHTML=dlBtn(()=>csv('distribuidores',distHead(),distRows(L)),`Descargar ${L.length} (CSV)`);
 $('#tb').innerHTML=`<tr>${h('nom','Distribuidor','t')}${h('cur',MET[m].n+' '+perLbl())}${h('base',baseLbl())}${h('var','Var')}${h('al','Alertas')}${h('mor','Mor. total')}${h('res','Reserva')}${h('sub','Subterritorio','t')}${h('comp','Compañía','t')}${h('grp','Nivel','t')}${h('suc','Sucursal','t')}</tr>`+
  L.map(d=>{const p=P.get(d.id);return`<tr class="click" data-id="${d.id}"><td class="t">${esc(d.nombre)}<span class="sm">${esc(d.sub)} · ${d.grp}</span></td><td>${F(p.cur)}</td><td>${F(p.base)}</td><td>${sg(vr(p.base,p.cur))}</td><td>${d.al.length?`<button class="abtn" data-alid="${d.id}">${d.al.length} ▸</button>`:'<span class="muted">0</span>'}</td><td class="${d.mortot>=D.meta.mortot?'dn':''}">${fm.p(d.mortot)}</td><td>${fm.p(d.reserva)}</td><td class="t">${esc(d.sub)}</td><td class="t">${esc(d.comp)}</td><td class="t"><span class="lvl ${d.grp=='DJ'?'dj':''}">${d.grp}</span></td><td class="t">${esc(d.suc)}</td></tr>`}).join('');
 $('#tb').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.s;SORT=SORT.k==k?{k,d:-SORT.d}:{k,d:-1};tabla()})}

 const lbl=kind=='sub'?'Subterritorio':kind=='comp'?'Compañía · '+esc(L[0]?L[0].sub:''):'Sucursal';
 $('#panel').innerHTML=`<div class="top"><div><h2>${esc(name)}</h2><div class="muted">${lbl} · ${L[0]?L[0].red:''} · ${perLbl()} ${CMP[S.cmp]}</div></div><button class="x" aria-label="Cerrar">✕</button></div>
 <div class="acts" style="margin:0 0 10px">${dlBtn(()=>csv(kind+'_'+name,distHead(),distRows(L)),'Integrantes CSV')}${dlBtn(()=>csv(kind+'_'+name+'_meses',monthHead(),monthRows(L)),'Meses CSV')}<button class="btn" onclick="print()">🖨︎ PDF</button><button class="btn pri" data-apply="${kind}|${esc(name)}">Filtrar todo el tablero por ${kind=='sub'?'este equipo':kind=='comp'?'esta compañía':'esta sucursal'}</button></div>

 openSheet();$('#panel').scrollTop=0;yearChart($('#chg'),L,m)}

 const terr=S.cmp=='ytd'?(()=>{const a=ytdIdx(S.mes);return a.some(i=>s[i]!=null)?a.reduce((t,i)=>t+(s[i]||0),0):null})():s[S.mes];
 $('#panel').innerHTML=`<div class="top"><div><h2>${esc(d.nombre)}</h2><div class="muted">${d.id} · ${d.red} · ${esc(d.sub)} · ${esc(d.comp)}<br>${d.es_dj?'DJ':'Nivel '+esc(d.nivel||'–')}${d.sponsor?' · sponsor '+d.sponsor:''} · ${esc(d.suc)}${d.fecha_dist?' · distribuidor desde '+d.fecha_dist:''}${d.baja?' · <b>BAJA</b>':''}${d.clasif!='archivo'?' · <b>'+esc(d.clasif)+'</b>':''}</div></div><button class="x" aria-label="Cerrar">✕</button></div>
 <div class="acts" style="margin:0 0 10px">${dlBtn(()=>csv('distribuidor_'+d.id+'_meses',monthHead(),monthRows(L)),'Meses CSV')}<button class="btn" onclick="print()">🖨︎ PDF</button></div>
 ${d.al.map(a=>`<div class="al" style="padding:8px 0"><span class="sev s${a.sev}">${esc(a.tipo)}</span><span>${esc(a.detalle)}</span></div>`).join('')}
 ${noData(L)}${tiles(L,false,true)}
 <div class="grid" style="margin-top:10px"><div class="tile"><div class="l">Morosidad total</div><div class="v ${d.mortot>=D.meta.mortot?'dn':''}">${fm.p(d.mortot)}</div><div class="s">31+: ${fm.p(d.mor31,2)} · corte ${cTxt(d.corte)}</div></div><div class="tile"><div class="l">Reserva</div><div class="v">${fm.p(d.reserva)}</div><div class="s">Recompra ${fm.p(d.recompra)}</div></div><div class="tile"><div class="l">Compras territorio · USD</div><div class="v">${fm.k(terr)}</div><div class="s">${perLbl()} · incluye su descendencia</div></div></div>
 <div class="card"><h3><span>${MET[S.met].n} por mes</span></h3><div id="chd"></div></div>

 openSheet();$('#panel').scrollTop=0;yearChart($('#chd'),L,S.met)}
function alertList(ids){const set=new Set(ids);const A=D.alertas.filter(a=>set.has(a.id)).sort((a,b)=>b.sev-a.sev);
 $('#panel').innerHTML=`<div class="top"><h2>Alertas (${A.length})</h2><button class="x" aria-label="Cerrar">✕</button></div><div class="muted" style="margin-bottom:8px">Qué alerta tiene cada quien. Toca un nombre para ver su detalle.</div><div class="card" style="padding:0;margin:0">${A.map(a=>`<div class="al" data-id="${a.id}"><span class="sev s${a.sev}">${a.sev==3?'⛔ Alta':a.sev==2?'⚠️ Media':'• Baja'}</span><div><b>${esc(a.nombre)}</b> <span class="muted">· ${esc(a.sub)}</span><div class="muted">${esc(a.tipo)}: ${esc(a.detalle)}</div></div></div>`).join('')||'<p class="muted" style="padding:12px">Sin alertas.</p>'}</div>
 <div class="acts">${dlBtn(()=>csv('alertas_seleccion',['ID','Nombre','Subterritorio','Alerta','Detalle'],A.map(a=>[a.id,a.nombre,a.sub,a.tipo,a.detalle])))}</div>`;openSheet();$('#panel').scrollTop=0}
// ---------- eventos ----------
document.addEventListener('click',e=>{const t=e.target;
 const dl=t.closest('[data-dl]');if(dl){DL[dl.dataset.dl]();return}
 const ab=t.closest('[data-alid]');if(ab){alertList([ab.dataset.alid]);return}
 const al=t.closest('[data-alist]');if(al){alertList(JSON.parse(al.dataset.alist));return}
 if(t.id=='sheet'||t.closest('.x')){closeSheet();return}
 const ap=t.closest('[data-apply]');if(ap){const[k,n]=ap.dataset.apply.split('|');if(k=='sub'){S.sub=n;S.comp=''}else if(k=='comp')S.comp=n;else S.suc=n;closeSheet();render();return}
 const r=t.closest('[data-r]');if(r){S.red=r.dataset.r;S.sub='';S.comp='';render();return}
 const tb=t.closest('[data-t]');if(tb){S.tab=tb.dataset.t;render();scrollTo(0,0);return}
 const c=t.closest('[data-c]');if(c){S.cmp=c.dataset.c;render();return}
 const cl=t.closest('[data-clr]');if(cl){S[cl.dataset.clr]=cl.dataset.clr=='est'?'act':'';if(cl.dataset.clr=='sub')S.comp='';render();return}
 const fa=t.closest('[data-falerta]');if(fa){S.alerta=fa.dataset.falerta;S.tab='di';render();return}
 const mb=t.closest('[data-meby]');if(mb){S.meBy=mb.dataset.meby;render();return}
 const ms=t.closest('[data-mes]');if(ms){S.mes=+ms.dataset.mes;closeSheet();render();return}
 const sb=t.closest('[data-sub]');if(sb){openGroup('sub',sb.dataset.sub);return}
 const co=t.closest('[data-comp]');if(co){openGroup('comp',co.dataset.comp);return}
 const su=t.closest('[data-sucf]');if(su){openGroup('suc',su.dataset.sucf);return}
 const p=t.closest('[data-id]');if(p){openDist(p.dataset.id);return}});
$('#mes').onchange=e=>{S.mes=+e.target.value;render()};$('#met').onchange=e=>{S.met=e.target.value;render()};$('#fbtn').onclick=openFilters;
const GUIA=`<div class="card guide" style="margin-top:0"><h3>Qué medimos y cómo</h3>
<h4>Fuente</h4><p>Radiografía mensual de Hycite (PNL 13588 y la de Abdul, PNL 29365) + tu archivo DISTRUBUCIONES CHASEP & MEJAB (subterritorio, compañía, nivel, sponsor, sucursal y bajas). Corte actual: ${cTxt(D.corte)}.</p>
<h4>Métricas mensuales (se comparan)</h4><ul><li><b>Compras compañía (USD)</b>: compras de la compañía de cada distribuidor. En equipos y compañías se suman sus integrantes; los DJ compran a través de la compañía de su distribuidor.</li><li><b>Órdenes</b> y <b>Reclutamiento</b>: conteos del mes.</li><li><b>Ticket promedio (MXN)</b>: promedio ponderado por órdenes.</li><li><b>Compras territorio (USD)</b>: incluye toda la descendencia; se muestra por persona y para el PNL (sumarla entre integrantes duplicaría).</li></ul>
<h4>Indicadores del corte (foto, no se suman)</h4><ul><li>Reserva, Morosidad 31+, Morosidad total y Recompra, con su histórico por corte en la pestaña Histórico.</li></ul>
<h4>Comparativos</h4><ul><li><b>vs mes anterior</b>: el mes elegido contra el mes previo.</li><li><b>vs mismo mes año anterior</b>: el mes elegido contra el mismo mes del año pasado.</li><li><b>Acumulado año vs año anterior</b>: enero al mes elegido contra el mismo periodo del año pasado.</li></ul>
<h4>Comparación justa</h4><p>Las variaciones comparan solo a los integrantes que tienen dato en el periodo actual (por ejemplo, si MEJAB aún no trae un mes, se excluye también del periodo base).</p><h4>Filtros de control</h4><ul><li>Red, Subterritorio, Compañía, Sucursal, Nivel (PNL, Royal, Blue, N1–N4, DJ) y Tipo (distribuidor o DJ).</li><li>Estatus: activos, bajas (hoja BAJAS) o todos.</li><li>Alertas: con o sin alerta, o por tipo.</li><li>Actividad del mes: con compras, sin compras o sin compras 2 meses seguidos (detecta inactivos).</li><li>Antigüedad como distribuidor: menos de 1 año, 1 a 3, más de 3 (seguimiento a nuevos).</li></ul>
<h4>Alertas</h4><ul><li>Morosidad total ≥39%, morosidad 31+ ≥10%, recompra ≥2% (metas del reporte Hycite).</li><li>Caída mayor a 20% de compras de compañía YTD vs año anterior, 3 meses sin reclutar, 2 meses sin órdenes.</li></ul>
<h4>Descargas</h4><p>Cada tabla tiene botón CSV (abre en Excel o Google Sheets) con lo que estés viendo según filtros, mes, comparación y métrica. En el detalle de equipo, compañía o persona hay botón PDF.</p></div>`;
