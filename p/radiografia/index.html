/* ---------- charts ---------- */
function lineChart(el,labels,series,opt={}){
 const W=Math.max(300,Math.round(el.clientWidth||700)),H=opt.h||240,P={l:54,r:12,t:10,b:28};
 const all=series.flatMap(s=>s.v).filter(v=>v!=null);const max=(Math.max(0,...all)*1.08)||1;
 const x=i=>P.l+(labels.length<2?0:i*(W-P.l-P.r)/(labels.length-1)),y=v=>H-P.b-(v/max)*(H-P.t-P.b);
 let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P.l-6}" y="${yy+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${(opt.yfmt||usdk)(v)}</text>`}
 const step=Math.ceil(labels.length/8);labels.forEach((l,i)=>{if(i%step==0)g+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink3)">${l}</text>`});
 series.forEach(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v);pen=true});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
  s.v.forEach((v,i)=>{if(v!=null&&(i==s.v.length-1||s.v[i+1]==null))g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}" stroke="var(--card)" stroke-width="2"/>`})});
 g+=`<line class="xh" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink3)" stroke-dasharray="3 3" style="display:none"/><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent" class="hit"/>`;
 el.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label||''}">${g}</svg><div class="tip"></div></div>`;
 const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
 const move=ev=>{const r=svg.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,sx=px*W/r.width;let i=Math.round((sx-P.l)/((W-P.l-P.r)/(labels.length-1||1)));i=Math.max(0,Math.min(labels.length-1,i));
  xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';
  tip.innerHTML=`<b>${opt.tipLabel?opt.tipLabel(i):labels[i]}</b>`+series.map(s=>`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:5px"></i>${s.n}: <b>${(opt.fmt||usd)(s.v[i])}</b></div>`).join('');
  tip.style.display='block';const tx=x(i)*r.width/W;tip.style.left=Math.min(r.width-tip.offsetWidth,Math.max(0,tx-tip.offsetWidth/2))+'px';tip.style.top='0px'};
 svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('touchmove',move,{passive:true});
 svg.addEventListener('mouseleave',()=>{tip.style.display='none';xh.style.display='none'});
}
function spark(v,c='var(--blue)'){const W=120,H=30,vs=v.filter(x=>x!=null);if(vs.length<2)return'';const mx=Math.max(...vs,1);let d='',pen=false;v.forEach((a,i)=>{if(a==null){pen=false;return}d+=(pen?'L':'M')+(i*W/(v.length-1)).toFixed(1)+','+(H-2-(a/mx)*(H-4)).toFixed(1);pen=true});return`<svg viewBox="0 0 ${W} ${H}" width="120" height="30" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`}

 const pend=D.pendientes.filter(p=>inRed(p));
 $('#s-org').innerHTML=`<p class="muted">Red → Subterritorio → Compañía → integrantes. Monto = compras de compañía YTD (USD). Toca a alguien para ver su detalle.</p>`+
  ['CHASEP','MEJAB'].filter(r=>RED=='Todas'||RED==r).map(r=>{
   const subs=Object.keys(bySub).filter(k=>k.startsWith(r+'|')).sort((a,b)=>a.startsWith(r+'|PNL')?-1:b.startsWith(r+'|PNL')?1:a.localeCompare(b));
   return `<h3 style="margin:16px 2px 4px">${r}</h3>`+subs.map(k=>{const L=bySub[k];const comps={};L.forEach(d=>{(comps[d.comp||'—']=comps[d.comp||'—']||[]).push(d)});
    const tot=L.reduce((s,d)=>s+(d.ytd.compras_compania[1]||0),0);
    return `<details><summary><span>${k.split('|')[1]} <span class="tag">${L.length}</span></span><span>${usdk(tot)}</span></summary>${Object.entries(comps).sort((a,b)=>b[1].reduce((s,d)=>s+(d.ytd.compras_compania[1]||0),0)-a[1].reduce((s,d)=>s+(d.ytd.compras_compania[1]||0),0)).map(([c,M])=>{
      M.sort((a,b)=>(a.es_dj-b.es_dj)||((b.ytd.compras_compania[1]||0)-(a.ytd.compras_compania[1]||0)));
      return `<details><summary><span>${c}</span><span class="muted">${M.length}</span></summary>${M.map(person).join('')}</details>`}).join('')}</details>`}).join('')}).join('')+
  (pend.length?`<div class="card"><h3>En el archivo pero aún sin Radiografía (${pend.length})</h3><div class="muted">Normalmente DJs nuevos; aparecerán en el próximo corte.</div>${pend.map(p=>`<div class="pp"><div class="who"><div><span class="lvl dj">${p.nivel||'·'}</span>${p.nombre}</div><small>${p.id} · ${p.sub} · ${p.comp}</small></div></div>`).join('')}</div>`:'');

 /* ALERTAS */
 const tipos=[...new Set(als.map(a=>a.tipo))];
 $('#s-al').innerHTML=`<p class="muted">Metas del reporte Hycite: morosidad 31+ &lt;10%, morosidad total &lt;39%, recompra &lt;2%. Además: caída &gt;20% en compras YTD, 3 meses sin reclutar, 2 meses sin órdenes.</p>`+
  (als.length?tipos.map(t=>{const L=als.filter(a=>a.tipo==t);return `<div class="card" style="padding:0"><h3 style="padding:12px 12px 4px">${t} · ${L.length}</h3>${L.map(a=>`<div class="al" data-id="${a.id}"><span class="sev s${a.sev}">${a.sev==3?'⛔ Alta':a.sev==2?'⚠️ Media':'• Baja'}</span><div><b>${a.nombre}</b><div class="muted">${a.sub} · ${a.detalle}</div></div></div>`).join('')}</div>`}).join(''):'<div class="card">Sin alertas 🎉</div>');

 /* DISTRIBUIDORES */
 if(!$('#q')){$('#s-di').innerHTML=`<div class="row"><input type="search" id="q" placeholder="Buscar nombre o ID"><select id="fs"></select></div><div class="scroll" style="margin-top:10px"><table id="tb"></table></div>`;$('#q').oninput=tabla;$('#fs').onchange=tabla}
 const subs=[...new Set(ds.map(d=>d.sub))].sort();$('#fs').innerHTML='<option value="">Todos los subterritorios</option>'+subs.map(s=>`<option>${s}</option>`).join('');
 tabla();

 /* HISTÓRICO */
 const pnl=D.dists.find(d=>d.id=='13588');
 const cortes=D.cortes;
 const avgC=(k,c)=>{const L=D.dists.filter(d=>inRed(d)&&d.h[k][c]!=null);return L.length?L.reduce((s,d)=>s+d.h[k][c],0)/L.length:null};
 $('#s-hi').innerHTML=`<div class="card"><h3>Morosidad y reserva por corte</h3><div class="muted">Valor del renglón PNL 13588 (total) y promedio de la red actual con dato en ese corte.</div>
  <div class="legend"><span><i style="background:var(--blue)"></i>Morosidad total PNL</span><span><i style="background:var(--silver)"></i>Reserva PNL</span></div><div id="ch2"></div>
  <div class="scroll" style="max-height:none;margin-top:8px"><table><tr><th class="t">Corte</th><th>Reserva PNL</th><th>Mor. 31+ PNL</th><th>Mor. total PNL</th><th>Recompra PNL</th><th>Mor. total prom. red</th></tr>
  ${cortes.slice().reverse().map(c=>`<tr><td>${corteTxt(c)}</td><td>${pct(pnl&&pnl.h.reserva[c])}</td><td>${pct(pnl&&pnl.h.mor31[c],2)}</td><td>${pct(pnl&&pnl.h.mortot[c])}</td><td>${pct(pnl&&pnl.h.recompra[c])}</td><td>${pct(avgC('mortot',c))}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>Compras de territorio por mes (USD)</h3><div class="scroll" style="max-height:none"><table><tr><th class="t">Mes</th><th>${ys.prev}</th><th>${ys.last}</th><th>Var</th></tr>
  ${MES.map((m,i)=>`<tr><td>${m}</td><td>${usd(ys.a[i])}</td><td>${usd(ys.b[i])}</td><td>${sg(ys.a[i]&&ys.b[i]!=null?varp(ys.a[i],ys.b[i]):null)}</td></tr>`).join('')}</table></div></div>
  <p class="note">Cortes cargados: ${cortes.map(corteTxt).join(', ')}. Cada Radiografía nueva de Hycite (y la de Abdul cuando la reenvía) se agrega sola; si un mes se re-emite, gana el dato más reciente.</p>`;
 if(pnl)lineChart($('#ch2'),cortes.map(corteTxt),[{n:'Morosidad total',v:cortes.map(c=>pnl.h.mortot[c]??null),c:'var(--blue)'},{n:'Reserva',v:cortes.map(c=>pnl.h.reserva[c]??null),c:'var(--silver)'}],{fmt:v=>pct(v),yfmt:v=>(v*100).toFixed(0)+'%',h:220,label:'Morosidad por corte'});
}
let SORT={k:'act',d:-1};
function tabla(){
 const q=($('#q').value||'').toUpperCase(),fs=$('#fs').value;
 let L=DS().filter(d=>(!fs||d.sub==fs)&&(!q||d.nombre.toUpperCase().includes(q)||d.id.includes(q)));
 const get={nom:d=>d.nombre,sub:d=>d.sub,act:d=>d.ytd.compras_compania[1]||0,var:d=>varp(d.ytd.compras_compania[0],d.ytd.compras_compania[1])??-9,ord:d=>d.ytd.ordenes[1]||0,rec:d=>d.ytd.reclutamiento[1]||0,mor:d=>d.mortot??-1,res:d=>d.reserva??-1};
 L.sort((a,b)=>{const x=get[SORT.k](a),y=get[SORT.k](b);return (x>y?1:x<y?-1:0)*SORT.d});
 const h=(k,t,c='')=>`<th class="${c}" data-s="${k}">${t}${SORT.k==k?(SORT.d>0?' ↑':' ↓'):''}</th>`;
 $('#tb').innerHTML=`<tr>${h('nom','Distribuidor','t')}${h('sub','Subterritorio','t')}${h('act','Compras YTD')}${h('var','Var')}${h('ord','Órdenes')}${h('rec','Reclut.')}${h('mor','Mor. total')}${h('res','Reserva')}</tr>`+
  L.map(d=>`<tr data-id="${d.id}"><td class="t">${d.es_dj?'<span class="lvl dj">DJ</span>':''}${d.nombre}</td><td class="t">${d.sub}</td><td>${usd(d.ytd.compras_compania[1])}</td><td>${sg(varp(d.ytd.compras_compania[0],d.ytd.compras_compania[1]))}</td><td>${num(d.ytd.ordenes[1])}</td><td>${num(d.ytd.reclutamiento[1])}</td><td class="${d.mortot>=D.meta.mortot?'dn':''}">${pct(d.mortot)}</td><td>${pct(d.reserva)}</td></tr>`).join('');
 $('#tb').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.s;SORT=SORT.k==k?{k,d:-SORT.d}:{k,d:-1};tabla()});
}
function openDist(id){
 const d=D.dists.find(x=>x.id==id);if(!d)return;
 const al=D.alertas.filter(a=>a.id==id);const ys=yearSplit(d.m.compras_compania);const yo=yearSplit(d.m.ordenes);
 const cs=Object.keys(d.h.mortot).sort();
 $('#panel').innerHTML=`<button class="x" aria-label="Cerrar">✕</button><h2>${d.nombre}</h2><div class="muted">${d.id} · ${d.red} · ${d.sub} · ${d.comp||''}<br>${d.es_dj?'DJ':'Nivel '+(d.nivel||'–')}${d.sponsor?' · sponsor '+d.sponsor:''}${d.suc?' · '+d.suc:''} · corte ${corteTxt(d.corte)}${d.clasif!='archivo'?' · <b>'+d.clasif+'</b>':''}</div>
 ${al.map(a=>`<div class="al" style="padding:8px 0"><span class="sev s${a.sev}">${a.tipo}</span><span>${a.detalle}</span></div>`).join('')}
 <div class="grid" style="margin-top:10px"><div class="tile"><div class="l">Compras YTD</div><div class="v">${usdk(d.ytd.compras_compania[1])}</div><div class="s">${sg(varp(...d.ytd.compras_compania))}</div></div>
 <div class="tile"><div class="l">Órdenes YTD</div><div class="v">${num(d.ytd.ordenes[1])}</div><div class="s">vs ${num(d.ytd.ordenes[0])}</div></div>
 <div class="tile"><div class="l">Reclutamiento YTD</div><div class="v">${num(d.ytd.reclutamiento[1])}</div><div class="s">vs ${num(d.ytd.reclutamiento[0])}</div></div>
 <div class="tile"><div class="l">Ticket prom. MXN</div><div class="v">${usdk(d.ytd.ticket_mxn[1])}</div><div class="s">vs ${usdk(d.ytd.ticket_mxn[0])}</div></div>
 <div class="tile"><div class="l">Morosidad total</div><div class="v ${d.mortot>=D.meta.mortot?'dn':''}">${pct(d.mortot)}</div><div class="s">31+: ${pct(d.mor31,2)}</div></div>
 <div class="tile"><div class="l">Reserva · Recompra</div><div class="v">${pct(d.reserva)}</div><div class="s">Recompra ${pct(d.recompra)}</div></div></div>
 <div class="card"><h3>Compras de compañía por mes (USD)</h3><div class="legend"><span><i style="background:var(--silver)"></i>${ys.prev}</span><span><i style="background:var(--blue)"></i>${ys.last}</span></div><div id="ch3"></div></div>
 <div class="card"><h3>Morosidad total por corte</h3><div class="muted">${cs.map(c=>corteTxt(c)+': '+pct(d.h.mortot[c])).join(' · ')||'Sin datos'}</div></div>`;
 $('#sheet').classList.add('on');
 lineChart($('#ch3'),MES,[{n:ys.prev,v:ys.a,c:'var(--silver)'},{n:ys.last,v:ys.b,c:'var(--blue)'}],{h:200,tipLabel:i=>MES[i]});
}
render();
</script>
</body>
</html>
